services:
  api:
    build: ./backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend/app:/app/app
    ports:
      - "8000:8000"

  web:
    image: node:22-alpine
    working_dir: /web
    command: sh -c "npm install && npx vite --host 0.0.0.0 --port 5173"
    environment:
      SIFT_API_URL: http://api:8000
    volumes:
      - ./frontend:/web
      - /web/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - api
